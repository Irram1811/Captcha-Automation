<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Normal Login Fixture</title><link rel="stylesheet" href="css/theme.css"></head>
<body class="fixture-page none-page">
  <video class="fixture-video" autoplay muted loop playsinline aria-hidden="true"><source src="assets/background.mp4" type="video/mp4"></video>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <p class="eyebrow">Step 4 · Complete</p>
      <h1 id="login-title">Login</h1>
      <p class="login-welcome">Welcome back</p>
      <form class="login-form" action="#" method="post">
        <div class="login-field">
          <label for="email">User Name</label>
          <input id="email" name="email" type="email" placeholder="User Name" required>
          <span class="field-icon" aria-hidden="true">♙</span>
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Password" required>
          <span class="field-icon" aria-hidden="true">◉</span>
        </div>
        <label class="remember"><input type="checkbox" name="remember"> <span>Remember me</span></label>
        <button type="submit">Login</button>
      </form>
      <p class="signup">Don’t have an account? <a href="#signup">Signup</a></p>
      <p id="status">ready</p>
    </section>
  </main>
</body>
</html>
