[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "captcha_agent"
version = "0.1.0"
description = "A controlled, evidence-producing CAPTCHA interaction agent."
requires-python = ">=3.11"
dependencies = [
  "playwright",
  "pydantic",
  "pyyaml",
  "typer",
  "rich",
  "python-dotenv",
  "aiohttp",
  "opencv-python-headless",
  "numpy",
  "pillow",
  "anthropic",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
captcha-agent = "captcha_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: tests that call the configured live Anthropic model"]
